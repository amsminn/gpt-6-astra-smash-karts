services:
  arena:
    build:
      context: .
      args:
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
        VITE_GAME_SERVER_URL: ${VITE_GAME_SERVER_URL:-}
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    restart: unless-stopped
